# Meilisearch  →  http://localhost:7700   (master key in .env)
services:
  meilisearch:
    image: getmeili/meilisearch:v1.49
    container_name: meilisearch
    profiles: [meilisearch]
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
    ports:
      - "${BIND_IP:-127.0.0.1}:7700:7700"
    # no healthcheck: the image is minimal (no curl). Probe: curl localhost:7700/health
    volumes:
      - ./volumes/vol-meilisearch:/meili_data
