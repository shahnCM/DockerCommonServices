# MongoDB 7  →  host localhost:27017   (mongodb://admin:admin@mongodb-7:27017 in-network)
services:
  mongodb-7:
    image: mongo:7
    container_name: mongodb-7
    profiles: [mongodb-7]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin}
    ports:
      - "${BIND_IP:-127.0.0.1}:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    volumes:
      - ./volumes/vol-mongodb-7/data/db:/data/db
      - ./volumes/vol-mongodb-7/data/configdb:/data/configdb
