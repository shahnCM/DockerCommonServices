# DynamoDB Local (+ Streams on the same port)
#   inside the workstation → http://dynamodb-local:8000   (AWS_ENDPOINT_URL_DYNAMODB is preset)
#   from the host          → http://localhost:18000       (8000 belongs to the workstation range)
# Runs as uid 1000 and needs a writable data dir — `dev` pre-creates it as you.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    profiles: [dynamodb-local]
    restart: unless-stopped
    # -sharedDb is not optional: without it the db file is keyed by access-key+region,
    # so a seed script and the app can silently see different tables.
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    ports:
      - "${BIND_IP:-127.0.0.1}:18000:8000"
    deploy:
      resources:
        limits:
          memory: 1G        # JVM — 512M is too tight
          cpus: '1.0'
    volumes:
      - ./volumes/vol-dynamodb-local/data:/home/dynamodblocal/data
