# MySQL 8.4 LTS  →  host localhost:3306   (in-network: mysql-8:3306)
services:
  mysql-8:
    image: mysql:8.4
    container_name: mysql-8
    profiles: [mysql-8]
    restart: unless-stopped
    environment:
      MYSQL_USER: ${DB_MYSQL_USERNAME:-dev_user}
      MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD:-dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: ${DB_MYSQL_DATABASE:-app}
    ports:
      - "${BIND_IP:-127.0.0.1}:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    volumes:
      - ./volumes/vol-mysql-8/data:/var/lib/mysql
