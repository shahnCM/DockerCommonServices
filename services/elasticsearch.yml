# Elasticsearch 8 (single node, security off)  →  http://localhost:9229
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: elasticsearch
    profiles: [elasticsearch]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${BIND_IP:-127.0.0.1}:9229:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    volumes:
      - ./volumes/vol-elasticsearch/data:/usr/share/elasticsearch/data
