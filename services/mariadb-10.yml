# MariaDB 10.11 LTS  →  host localhost:3308   (drop-in for mysql-5 on ARM hosts)
services:
  mariadb-10:
    image: mariadb:10.11
    container_name: mariadb-10
    profiles: [mariadb-10]
    restart: unless-stopped
    environment:
      MARIADB_USER: ${DB_MYSQL_USERNAME:-dev_user}
      MARIADB_PASSWORD: ${DB_MYSQL_PASSWORD:-dev_password}
      MARIADB_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD:-dev_root_password}
      MARIADB_DATABASE: ${DB_MYSQL_DATABASE:-app}
    ports:
      - "${BIND_IP:-127.0.0.1}:3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    volumes:
      - ./volumes/vol-mariadb-10/data:/var/lib/mysql
