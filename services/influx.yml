# InfluxDB 2  →  http://localhost:8186   (org local_docker · bucket local_docker · user/passpass)
services:
  influx:
    image: influxdb:2
    container_name: influx
    profiles: [influx]
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-user}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-passpass}
      DOCKER_INFLUXDB_INIT_ORG: local_docker
      DOCKER_INFLUXDB_INIT_BUCKET: local_docker
      DOCKER_INFLUXDB_INIT_RETENTION: 1w
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:-randomTokenValue1234}
    ports:
      - "${BIND_IP:-127.0.0.1}:8186:8086"
    volumes:
      - ./volumes/vol-influx/data:/var/lib/influxdb2
      - ./volumes/vol-influx/config:/etc/influxdb2
