# PostgreSQL 16 + PostGIS, pgvector, pg_cron, pg_partman  →  host localhost:5433
services:
  postgres-16:
    build:
      context: ./docker_files/postgres
      dockerfile: postgres-16-w-gis-extensions.Dockerfile
    image: postgres-16-gis:local
    container_name: postgres-16
    profiles: [postgres-16]
    restart: unless-stopped
    # default max_connections=100 is too low once Octane workers × instances
    # stack up in load tests; app-side pooling still applies.
    command: -c max_connections=200
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:-admin}
    ports:
      - "${BIND_IP:-127.0.0.1}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./volumes/vol-postgres-16:/var/lib/postgresql/data
