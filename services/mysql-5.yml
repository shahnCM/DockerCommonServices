# MySQL 5.7 (EOL, for legacy apps — pairs with php7.2)  →  host localhost:3307
# Image is amd64-only and unmaintained; mariadb-10 is the wire-compatible alternative.
services:
  mysql-5:
    image: mysql:5.7
    platform: linux/amd64        # lets Apple-silicon hosts run it under emulation
    container_name: mysql-5
    profiles: [mysql-5]
    restart: unless-stopped
    environment:
      MYSQL_USER: ${DB_MYSQL_USERNAME:-dev_user}
      MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD:-dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: ${DB_MYSQL_DATABASE:-app}
    ports:
      - "${BIND_IP:-127.0.0.1}:3307:3306"
    # 5.7 closes every fd up to the hard limit at start; huge host limits make it crawl
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    volumes:
      - ./volumes/vol-mysql-5/data:/var/lib/mysql
